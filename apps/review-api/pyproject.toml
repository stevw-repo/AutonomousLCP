[project]
name = "asklegal-review-api"
version = "0.1.0"
description = "Declarative Review API application boundary"
requires-python = "==3.14.7"
dependencies = [
  "asklegal-application-runtime",
  "asklegal-contracts",
  "asklegal-domain",
  "asklegal-evidence-vault",
  "asklegal-management-register",
  "asklegal-management-register-adapter",
  "asklegal-observability",
  "asklegal-reporting",
  "fastapi>=0.116,<1",
  "pydantic>=2.12,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
asklegal-review-api = "asklegal_review_api.main:main"

[build-system]
requires = ["uv-build==0.12.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "asklegal_review_api"

[tool.uv.sources]
asklegal-application-runtime = { workspace = true }
asklegal-contracts = { workspace = true }
asklegal-domain = { workspace = true }
asklegal-evidence-vault = { workspace = true }
asklegal-management-register = { workspace = true }
asklegal-management-register-adapter = { workspace = true }
asklegal-observability = { workspace = true }
asklegal-reporting = { workspace = true }
