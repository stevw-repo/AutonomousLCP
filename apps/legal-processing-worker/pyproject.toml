[project]
name = "asklegal-legal-processing-worker"
version = "0.1.0"
description = "Declarative legal-processing-worker application boundary"
requires-python = "==3.14.7"
dependencies = [
  "asklegal-application-runtime",
  "asklegal-contracts",
  "asklegal-corpus",
  "asklegal-domain",
  "asklegal-durable-task-adapter",
  "asklegal-evidence-vault",
  "asklegal-legal-desks",
  "asklegal-management-register",
  "asklegal-management-register-adapter",
  "asklegal-observability",
  "asklegal-processing",
  "asklegal-reporting",
]

[project.scripts]
asklegal-legal-processing-worker = "asklegal_legal_processing_worker.main:main"

[build-system]
requires = ["uv-build==0.12.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "asklegal_legal_processing_worker"

[tool.uv.sources]
asklegal-application-runtime = { workspace = true }
asklegal-contracts = { workspace = true }
asklegal-corpus = { workspace = true }
asklegal-domain = { workspace = true }
asklegal-durable-task-adapter = { workspace = true }
asklegal-evidence-vault = { workspace = true }
asklegal-legal-desks = { workspace = true }
asklegal-management-register = { workspace = true }
asklegal-management-register-adapter = { workspace = true }
asklegal-observability = { workspace = true }
asklegal-processing = { workspace = true }
asklegal-reporting = { workspace = true }
