[project]
name = "asklegal-reporting"
version = "0.1.0"
description = "Human and machine-verifiable reporting boundary"
requires-python = "==3.14.7"
dependencies = [
  "asklegal-contracts",
  "asklegal-domain",
]

[build-system]
requires = ["uv-build==0.12.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "asklegal_reporting"

[tool.uv.sources]
asklegal-contracts = { workspace = true }
asklegal-domain = { workspace = true }
