[project]
name = "asklegal-source-connectors"
version = "0.1.0"
description = "Source-fact capture boundary without legal interpretation"
requires-python = "==3.14.7"
dependencies = [
  "asklegal-contracts",
  "asklegal-domain",
  "asklegal-evidence-vault",
]

[build-system]
requires = ["uv-build==0.12.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "asklegal_source_connectors"

[tool.uv.sources]
asklegal-contracts = { workspace = true }
asklegal-domain = { workspace = true }
asklegal-evidence-vault = { workspace = true }
