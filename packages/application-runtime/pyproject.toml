[project]
name = "asklegal-application-runtime"
version = "0.1.0"
description = "Framework-free application boundary contracts and local adapters"
requires-python = "==3.14.7"
dependencies = [
  "asklegal-contracts",
  "asklegal-domain",
  "cryptography>=50,<51",
  "pyjwt[crypto]>=2.13,<3",
]

[build-system]
requires = ["uv-build==0.12.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "asklegal_application_runtime"

[tool.uv.sources]
asklegal-contracts = { workspace = true }
asklegal-domain = { workspace = true }
