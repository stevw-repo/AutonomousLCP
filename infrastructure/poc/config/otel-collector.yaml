# Exact V1 POC collector configuration.
#
# The collector's accepted outbound profile is DENY: it sits on the internal
# `asklegal-telemetry` network and must not reach anything outside it. Until
# Prometheus and Grafana are admitted, the only exporter is `debug`, which
# writes a summary to the collector's own stdout and therefore to the journal.
# That is deliberately weak: it proves the collector accepts OTLP from the
# applications, and nothing about retention, sampling, or downstream storage.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
