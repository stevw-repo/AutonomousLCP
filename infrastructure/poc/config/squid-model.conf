# Egress profile MODEL_PROVIDER_ALLOWLIST.
#
# One host: the Azure OpenAI resource that serves the inference deployment. Only
# over 443. Anything else, including any other Azure OpenAI resource, is refused.
#
# This proxy does not by itself confine the worker. On a Docker routable network
# every member can reach the internet directly, so a worker that ignored its proxy
# setting would still get out. Closing that needs host firewall rules or a
# dual-homed proxy, and neither is applied yet.

acl model_provider dstdomain asklegal-eastus-testing.openai.azure.com

acl tls_port port 443
acl CONNECT method CONNECT

http_access deny !model_provider
http_access deny CONNECT !tls_port
http_access allow model_provider
http_access deny all

http_port 3128
cache deny all
pid_filename none
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
