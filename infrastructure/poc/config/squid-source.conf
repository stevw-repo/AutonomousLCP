# Egress profile OFFICIAL_SOURCE_ALLOWLIST.
#
# The nine hosts below are exactly the official publishers bound in the Hong Kong
# Legislation source register. Nothing else is reachable through this proxy, and
# only over HTTPS on 443 — the register's connector refuses an HTTP downgrade, so
# permitting port 80 here would only widen the reachable surface.
#
# This proxy does not by itself confine the worker. On a Docker routable network
# every member can reach the internet directly, so a worker that ignored its proxy
# setting would still get out. Closing that needs host firewall rules or a
# dual-homed proxy, and neither is applied yet.

acl official_sources dstdomain data.gov.hk
acl official_sources dstdomain resource.data.one.gov.hk
acl official_sources dstdomain www.elegislation.gov.hk
acl official_sources dstdomain egazette.gld.gov.hk
acl official_sources dstdomain www.basiclaw.gov.hk
acl official_sources dstdomain www.grs.gov.hk
acl official_sources dstdomain search.grs.gov.hk
acl official_sources dstdomain www.npc.gov.cn
acl official_sources dstdomain flk.npc.gov.cn

acl tls_port port 443
acl CONNECT method CONNECT

http_access deny !official_sources
http_access deny CONNECT !tls_port
http_access allow official_sources
http_access deny all

http_port 3128
cache deny all
pid_filename none
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
