# Egress profile PINECONE_EMBEDDING_ALLOWLIST.
#
# Two destinations: the Azure OpenAI resource that serves the embedding
# deployment, and Pinecone. Only over 443.
#
# Pinecone is two exact hosts: the control plane, and the data-plane host that
# Pinecone assigned to `testing-index-1`. Pinecone assigns that host when the index
# is created, so **recreating the index changes it and this file must be updated**;
# the symptom is a 403 from this proxy, not a Pinecone error.
#
# This proxy does not by itself confine the worker. On a Docker routable network
# every member can reach the internet directly, so a worker that ignored its proxy
# setting would still get out. Closing that needs host firewall rules or a
# dual-homed proxy, and neither is applied yet.

acl embedding_provider dstdomain asklegal-eastus-testing.openai.azure.com
acl pinecone dstdomain api.pinecone.io
acl pinecone dstdomain testing-index-1-t85jsjn.svc.aped-4627-b74a.pinecone.io

acl tls_port port 443
acl CONNECT method CONNECT

http_access deny !embedding_provider !pinecone
http_access deny CONNECT !tls_port
http_access allow embedding_provider
http_access allow pinecone
http_access deny all

http_port 3128
cache deny all
pid_filename none
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
