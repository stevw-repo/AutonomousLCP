[project]
name = "asklegal-legal-db-pipeline-workspace"
version = "0.0.0"
requires-python = "==3.14.7"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.0,<7",
  "pytest>=9.0,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/acquisition-worker",
  "apps/control-plane",
  "apps/legal-processing-worker",
  "apps/promotion-worker",
  "apps/review-api",
  "packages/contracts",
  "packages/application-runtime",
  "packages/corpus",
  "packages/domain",
  "packages/durable-task-adapter",
  "packages/evidence-vault",
  "packages/legal-desks",
  "packages/management-register",
  "packages/management-register-adapter",
  "packages/observability",
  "packages/processing",
  "packages/promotion",
  "packages/reporting",
  "packages/source-connectors",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = [
  "apps",
  "packages",
  "tools/tests",
]
markers = [
  "durable_emulator: requires the disposable digest-pinned local Durable Task Scheduler emulator",
  "image_admission: requires exact pinned OCI tools, the pinned Grype database, and local Docker",
  "package_spike: requires exact cached artifacts and performs clean network-disabled package proofs",
  "sql_server: requires the disposable digest-pinned local SQL Server container",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
  "N818",
  "S105",
  "TC001",
  "TC003",
]

